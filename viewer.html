<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0"
    />

    <title>Code Viewer - Interactive Search Tool</title>
    <link rel="preconnect" href="https://rsms.me/" />
    <link rel="stylesheet" href="https://rsms.me/inter/inter.css" />
    <!-- <zero-md> web component - renders markdown files in first tab, see pages/viewer/viewer.entry.md -->
    <script type="module" src="https://cdn.jsdelivr.net/npm/zero-md@3?register"></script>
    <style>
      .zero-md-container {
        padding: 8px;
        background: #fff;
        min-height: 50px;
      }
      /* not markdown file: no tab buttons, only "source" tab (ACE) is visible - see pages/viewer/viewer.entry.md */
      [data-vanilla-tabs][data-md="0"] > [data-buttons] {
        display: none;
      }
      body input,
      #root > label > input,
      #root > label > a {
        width: 100%;
        margin-bottom: 1px;
        border: 1px solid #f6f6f6;
        &:hover {
          border: 1px solid #ccc;
        }
      }
      a,
      input[type="search"] {
        font-family: Inter, sans-serif;
        font-feature-settings: "liga" 1, "calt" 1, /* fix for Chrome */ "zero", "ss01";
      }
      label {
        display: flex;
        span {
          width: 240px;
        }
      }
      textarea {
        border: 1px solid gray;
        width: 100%;
      }
      .content {
        width: 90%;
        margin-left: auto;
        margin-right: auto;
        margin-top: 20px;
      }
      .error {
        border: 1px solid red;
      }
    </style>
  </head>
  <body class="layout bg" nohead nofoot>
    <div class="content">
      <div id="root"></div>
    </div>
    <script type="module" src="/js/github.js"></script>
    <script src="/dist/viewer.entry.bundle.js"></script>
  </body>
</html>
