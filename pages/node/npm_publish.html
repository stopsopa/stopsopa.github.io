              ### 3. How to test semantic-release locally without publishing

              You can test the entire semantic-release lifecycle locally using the --dry-run (or -d) and --no-ci flags. In dry-run mode, it parses commits, generates notes, and simulates the release without pushing tags, creating GitHub releases, or publishing to npm.

              #### Method A: Dry Run with your local environment

              Run from your terminal in the repository root:

                # 1. Ensure build is ready
                npm run build   # or /bin/bash build.sh

                # 2. Run semantic-release in dry-run mode (read-only simulation)
                npx semantic-release --dry-run --no-ci

              If you want to test with a fake or real token to see the exact steps it executes:

                GITHUB_TOKEN="dummy" NPM_TOKEN="dummy" npx semantic-release --dry-run --no-ci --debug
              ──────
              #### Method B: Testing npm authentication directly

              If you want to test whether your NPM token is valid and can publish without OTP:

                # Check who you are logged in as using your token
                NPM_CONFIG_TOKEN="your_npm_token_here" npm whoami

              To test npm publish locally in dry-run mode (verifies tarball contents and packaging without actually uploading):

                npm publish --dry-run


            > where normally I should get GITHUB_TOKEN from?

              It depends on whether you are running in GitHub Actions or Locally:
              ──────
              ### 1. In GitHub Actions (Automatic — No Setup Needed)

              In GitHub Actions workflows, GITHUB_TOKEN is automatically created and injected by GitHub for every workflow run.
              You do not need to create or store a secret for it.

              In your tests.yml:17, you already have:

                env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

              GitHub automatically provides this secret.

              (The only thing you usually need in the workflow is permissions: contents: write so it can push git
              tags/releases, which you already configured on line 12).
              ──────
              ### 2. Locally on your machine (When testing)

              When running semantic-release on your laptop, you need a GitHub Personal Access Token (PAT):

              1. Go to GitHub Settings:
                  • URL: https://github.com/settings/tokens
              2. Click Generate new token -> Generate new token (classic) (or Fine-grained tokens).
              3. Give it a name (e.g. local-semantic-release-test).
              4. Select scope:
                  • For public repos: public_repo (or repo for private repos).
              5. Click Generate token and copy it.

              Then use it locally in your terminal:

                export GITHUB_TOKEN="ghp_xxxxxxxxxxxxxxxxxxxx"
              ──────
              │ Tip
              │ If you are only testing locally with --dry-run --no-ci, you can pass any dummy string (e.g.
              │ GITHUB_TOKEN="dummy") because dry-run mode won't attempt to make write API calls to GitHub.
