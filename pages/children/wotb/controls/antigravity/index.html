<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>WOTB Controls Settings</title>
    <style>
      /* Base Reset and Layout */
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      }

      body {
        background-color: #121417;
        color: #e0e0e0;
        padding: 10px 16px;
        display: flex;
        justify-content: center;
      }

      .container {
        width: 100%;
        max-width: 1400px;
        background-color: #1a1d22;
        border: 1px solid #2d3239;
        border-radius: 8px;
        padding: 10px 16px;
        box-shadow: 0 8px 24px rgba(0, 0, 0, 0.5);
      }

      h1 {
        font-size: 1.1rem;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 1px;
        margin-bottom: 8px;
        color: #f3f3f3;
        border-bottom: 1px solid #333a42;
        padding-bottom: 6px;
      }

      /* Top Controls: Sliders and Checkboxes */
      #top-controls {
        display: flex;
        flex-direction: column;
        gap: 6px;
        margin-bottom: 8px;
        background-color: #21252b;
        padding: 8px 12px;
        border-radius: 6px;
      }

      .top-row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
      }

      .range-label {
        flex: 1;
        font-size: 0.8rem;
        letter-spacing: 0.5px;
      }

      .range-val {
        color: #4da3ff;
        font-weight: 700;
        margin-left: 6px;
      }

      .range-input {
        flex: 1;
        max-width: 380px;
        height: 4px;
        cursor: pointer;
        accent-color: #4da3ff;
      }

      .checkbox-grid {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 6px 12px;
        margin-top: 4px;
        border-top: 1px solid #2d333c;
        padding-top: 6px;
      }

      .checkbox-cell {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 4px 8px;
        background: #1a1d22;
        border: 1px solid #2a2f38;
        border-radius: 4px;
        min-height: 28px;
      }

      .custom-checkbox {
        width: 16px;
        height: 16px;
        cursor: pointer;
        accent-color: #4da3ff;
      }

      /* 3-Column Keybindings Grid */
      #key-grid {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 4px 10px;
        margin-bottom: 8px;
      }

      .key-cell {
        display: flex;
        align-items: center;
        justify-content: space-between;
        background-color: #21252b;
        border: 1px solid #2e343d;
        border-radius: 4px;
        padding: 3px 8px;
        min-height: 32px;
      }

      .cell-info {
        display: flex;
        flex-direction: column;
        gap: 1px;
        margin-right: 8px;
        overflow: hidden;
        line-height: 1.1;
      }

      .cell-title {
        font-size: 0.72rem;
        font-weight: 700;
        color: #e6e6e6;
        white-space: nowrap;
        text-overflow: ellipsis;
        overflow: hidden;
      }

      .cell-subtitle {
        font-size: 0.62rem;
        color: #8b949e;
        white-space: nowrap;
        text-overflow: ellipsis;
        overflow: hidden;
      }

      .key-button {
        min-width: 64px;
        padding: 3px 6px;
        background-color: #2c323b;
        border: 1px solid #414954;
        border-radius: 3px;
        color: #fff;
        font-size: 0.75rem;
        font-weight: 700;
        text-align: center;
        cursor: pointer;
        transition: background 0.15s, border-color 0.15s;
      }

      .key-button:hover {
        background-color: #3b434e;
        border-color: #58a6ff;
      }

      .key-empty {
        color: #7d8590;
        border-style: dashed;
        background-color: #1a1d22;
      }

      /* Bottom Action Buttons */
      .actions-bar {
        display: flex;
        justify-content: flex-end;
        gap: 10px;
        border-top: 1px solid #2e343d;
        padding-top: 8px;
      }

      .btn-action {
        padding: 5px 12px;
        font-size: 0.78rem;
        font-weight: 600;
        border-radius: 4px;
        cursor: pointer;
        border: none;
        transition: filter 0.15s;
      }

      .btn-action:hover {
        filter: brightness(1.15);
      }

      .btn-primary {
        background-color: #238636;
        color: #ffffff;
      }

      .btn-secondary {
        background-color: #30363d;
        color: #c9d1d9;
        border: 1px solid #444c56;
      }

      /* Modal Overlay (Virtual Keyboard) */
      .modal-overlay {
        position: fixed;
        top: 0;
        left: 0;
        width: 100vw;
        height: 100vh;
        background-color: rgba(0, 0, 0, 0.75);
        display: none;
        justify-content: center;
        align-items: center;
        z-index: 1000;
      }

      .modal-content {
        background-color: #1e2227;
        border: 1px solid #3d444d;
        border-radius: 8px;
        padding: 20px;
        max-width: 900px;
        width: 95%;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.8);
        display: flex;
        flex-direction: column;
        gap: 14px;
      }

      .modal-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        border-bottom: 1px solid #2e343d;
        padding-bottom: 10px;
      }

      .modal-title {
        font-size: 1.1rem;
        font-weight: 700;
        color: #f0f6fc;
      }

      .modal-target-info {
        font-size: 0.9rem;
        color: #8b949e;
      }

      .modal-target-info strong {
        color: #58a6ff;
      }

      /* Modifiers and Mouse Selectors Bar */
      .kb-toolbar {
        display: flex;
        flex-wrap: wrap;
        justify-content: space-between;
        align-items: center;
        gap: 10px;
        background-color: #17191d;
        padding: 10px;
        border-radius: 6px;
      }

      .kb-group {
        display: flex;
        align-items: center;
        gap: 6px;
      }

      .kb-group-label {
        font-size: 0.78rem;
        font-weight: 600;
        text-transform: uppercase;
        color: #8b949e;
        margin-right: 4px;
      }

      .mod-btn,
      .mouse-btn {
        padding: 6px 12px;
        font-size: 0.8rem;
        background-color: #2b3038;
        border: 1px solid #3d444d;
        border-radius: 4px;
        color: #c9d1d9;
        cursor: pointer;
        font-weight: 600;
      }

      .mod-btn.active {
        background-color: #1f6feb;
        border-color: #58a6ff;
        color: #ffffff;
      }

      .mouse-btn:hover,
      .mod-btn:hover {
        border-color: #8b949e;
      }

      /* Virtual Keyboard Visual Layout */
      .virtual-keyboard {
        display: flex;
        flex-direction: column;
        gap: 6px;
        background-color: #16181b;
        padding: 12px;
        border-radius: 6px;
        border: 1px solid #2b3038;
      }

      .kb-row {
        display: flex;
        gap: 6px;
        width: 100%;
      }

      .kb-key {
        flex: 1;
        height: 42px;
        background-color: #2b3038;
        border: 1px solid #3d444d;
        border-radius: 4px;
        color: #f0f6fc;
        font-size: 0.82rem;
        font-weight: 600;
        cursor: pointer;
        display: flex;
        justify-content: center;
        align-items: center;
        user-select: none;
        transition: background 0.1s, transform 0.05s;
      }

      .kb-key:hover {
        background-color: #3b424d;
        border-color: #58a6ff;
      }

      .kb-key:active {
        transform: scale(0.96);
      }

      /* Modal Footer Buttons */
      .modal-footer {
        display: flex;
        justify-content: space-between;
        align-items: center;
        border-top: 1px solid #2e343d;
        padding-top: 12px;
      }

      /* Conflict Confirmation Modal */
      .conflict-overlay {
        position: fixed;
        top: 0;
        left: 0;
        width: 100vw;
        height: 100vh;
        background-color: rgba(0, 0, 0, 0.82);
        display: none;
        justify-content: center;
        align-items: center;
        z-index: 1100;
      }

      .conflict-box {
        background-color: #221c1a;
        border: 2px solid #d29922;
        border-radius: 8px;
        padding: 24px;
        max-width: 520px;
        width: 90%;
        text-align: center;
        box-shadow: 0 8px 30px rgba(0, 0, 0, 0.9);
        display: flex;
        flex-direction: column;
        gap: 16px;
      }

      .conflict-title {
        color: #f0883e;
        font-size: 1.25rem;
        font-weight: 700;
      }

      .conflict-message {
        font-size: 0.95rem;
        color: #e6edf3;
        line-height: 1.5;
      }

      .conflict-actions {
        display: flex;
        justify-content: center;
        gap: 16px;
        margin-top: 8px;
      }

      .btn-override {
        background-color: #da3633;
        color: white;
      }

      .btn-cancel {
        background-color: #30363d;
        color: #c9d1d9;
        border: 1px solid #444c56;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <h1>Controls Settings</h1>

      <!-- Top Rows: Sliders and Checkboxes -->
      <div id="top-controls"></div>

      <!-- 3-Column Customizable Keybinding Grid -->
      <div id="key-grid"></div>

      <!-- Bottom Actions: Download and Reset -->
      <div class="actions-bar">
        <button type="button" id="reset-defaults-btn" class="btn-action btn-secondary">Reset to Defaults</button>
        <button type="button" id="download-json-btn" class="btn-action btn-primary">Download Configuration JSON</button>
      </div>
    </div>

    <!-- On-Screen Mac Keyboard Popup Modal -->
    <div id="keyboard-modal" class="modal-overlay">
      <div class="modal-content">
        <div class="modal-header">
          <div>
            <span class="modal-title">Customize Key Binding</span>
            <div class="modal-target-info">
              Slot: <strong id="modal-target-label">-</strong> | Current: <span id="modal-current-val">-</span>
            </div>
          </div>
          <button type="button" id="modal-close-btn" class="btn-action btn-secondary" style="padding: 4px 10px">
            ✕
          </button>
        </div>

        <!-- Modifier Toggles and Mouse Buttons -->
        <div class="kb-toolbar">
          <div class="kb-group">
            <span class="kb-group-label">Modifiers:</span>
            <button type="button" id="mod-shift" class="mod-btn">Shift (⇧)</button>
            <button type="button" id="mod-ctrl" class="mod-btn">Ctrl (⌃)</button>
            <button type="button" id="mod-alt" class="mod-btn">Option / Alt (⌥)</button>
            <button type="button" id="mod-cmd" class="mod-btn">Cmd (⌘)</button>
          </div>
          <div class="kb-group">
            <span class="kb-group-label">Mouse:</span>
            <button type="button" class="mouse-btn" data-key="L MOUSE">L MOUSE</button>
            <button type="button" class="mouse-btn" data-key="M MOUSE">M MOUSE</button>
            <button type="button" class="mouse-btn" data-key="R MOUSE">R MOUSE</button>
            <button type="button" class="mouse-btn" data-key="MOUSE 4">M4</button>
            <button type="button" class="mouse-btn" data-key="MOUSE 5">M5</button>
          </div>
        </div>

        <!-- Virtual Keyboard Layout Container -->
        <div id="virtual-keyboard" class="virtual-keyboard"></div>

        <!-- Modal Footer -->
        <div class="modal-footer">
          <button type="button" id="modal-clear-btn" class="btn-action btn-secondary" style="color: #f85149">
            Clear / Unassign Slot
          </button>
          <button
            type="button"
            onclick="document.getElementById('keyboard-modal').style.display='none'"
            class="btn-action btn-secondary"
          >
            Cancel
          </button>
        </div>
      </div>
    </div>

    <!-- Conflict Notification Modal -->
    <div id="conflict-modal" class="conflict-overlay">
      <div class="conflict-box">
        <div class="conflict-title">Key Conflict Detected</div>
        <div id="conflict-message" class="conflict-message"></div>
        <div class="conflict-actions">
          <button type="button" id="conflict-override-btn" class="btn-action btn-override">Override & Reassign</button>
          <button type="button" id="conflict-cancel-btn" class="btn-action btn-cancel">Cancel</button>
        </div>
      </div>
    </div>

    <!-- Runtime script -->
    <script src="./wotb.js"></script>
  </body>
</html>
