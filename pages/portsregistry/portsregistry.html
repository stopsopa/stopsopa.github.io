<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0"
    />

    <title>Ports Registry - Port Management & Configuration</title>
    <link rel="stylesheet" href="/css/gcp-css.css" />
    <link rel="stylesheet" href="/dist/portsregistry.entry.bundle.css" />
  </head>
  <body class="layout bg">
    <div class="body">
      <div class="inside">
        <!-- tabs: css/js of vanilla-tabs are loaded and initialised by /js/github.js, here only markup -->
        <div data-vanilla-tabs>
          <div data-buttons>
            <span class="active" data-testid="tab-ports">ports</span>
            <span data-testid="tab-links">links</span>
          </div>
          <div data-tabs>
            <div>
              <div id="app"></div>
            </div>
            <div>
              <div class="gcp-css pr-links">
                <a
                  href="https://www.iana.org/assignments/service-names-port-numbers/service-names-port-numbers.xhtml"
                  target="_blank"
                  data-testid="link-iana"
                  >Service Name and Transport Protocol Port Number Registry</a
                >
                <a
                  href="https://kubernetes.io/docs/concepts/services-networking/service/#nodeport"
                  target="_blank"
                  data-testid="link-kubernetes"
                  >kubernetes ports range [30000 - 32767]</a
                >
                <a
                  href="https://docs.aws.amazon.com/AmazonECS/latest/APIReference/API_PortMapping.html"
                  target="_blank"
                  data-testid="link-ecs-agent"
                  >Amazon ECS container agent ports [51678-51680]</a
                >
                <a
                  href="https://docs.aws.amazon.com/AmazonECS/latest/APIReference/API_PortMapping.html"
                  target="_blank"
                  data-testid="link-ecs-dynamic"
                  >Dynamic ports—Ports in the range [49152-65535]</a
                >
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>

    <script src="/public/preprocessed.js?portregistry"></script>
    <!-- despite get parameter preprocessed.js will be browser cached anyway even when loading more than one. Even when mixing techniques -> CJS | ESM -->
    <script type="module" src="/dist/firebase.core.entry.bundle.js"></script>
    <script type="module" src="/dist/portsregistry.entry.bundle.js"></script>
    <script type="module" src="/js/github.js"></script>
  </body>
</html>
