<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>copy</title>
    <script
      type="module"
      src="https://stopsopa.github.io/ace-editor-webcomponent/ace-web-component.js"
      data-main-ace="https://stopsopa.github.io/ace-editor-webcomponent/noprettier/ace/ace-builds-1.43.4/src-min-noconflict/ace.js"
    ></script>
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      html,
      body {
        height: 100%;
      }

      body {
        display: flex;
        flex-direction: column;
        height: 100vh;
        font-family: monospace;
        background: #1e1e1e;
        color: #ccc;
      }

      .toolbar {
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 8px 12px;
        background: #252526;
        border-bottom: 1px solid #333;
      }

      .toolbar a {
        color: #4fc1ff;
        text-decoration: none;
        font-size: 13px;
      }

      .toolbar a:hover {
        text-decoration: underline;
      }

      .toolbar button {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        padding: 4px 10px;
        font-size: 13px;
        font-family: inherit;
        background: #0e639c;
        color: #fff;
        border: none;
        cursor: pointer;
        border-radius: 2px;
      }

      .toolbar button:hover {
        background: #1177bb;
      }

      .toolbar button:active {
        background: #0d5c8a;
      }

      .toolbar button:disabled {
        background: #333;
        color: #777;
        cursor: not-allowed;
      }

      .toolbar-right {
        margin-left: auto;
        display: flex;
        align-items: center;
        gap: 8px;
      }

      .toolbar select {
        padding: 4px 8px;
        font-size: 13px;
        font-family: inherit;
        background: #3c3c3c;
        color: #cccccc;
        border: 1px solid #555;
        border-radius: 2px;
        outline: none;
        cursor: pointer;
      }

      .toolbar select:focus {
        border-color: #0e639c;
      }

      .record-dot {
        display: none;
        width: 10px;
        height: 10px;
        border-radius: 50%;
        background-color: #ff3b30;
      }

      .recording .record-dot {
        display: inline-block;
        animation: pulse 1s infinite ease-in-out;
      }

      @keyframes pulse {
        0% {
          transform: scale(0.9);
          opacity: 0.5;
          box-shadow: 0 0 0 0 rgba(255, 59, 48, 0.7);
        }
        50% {
          transform: scale(1.15);
          opacity: 1;
          box-shadow: 0 0 0 5px rgba(255, 59, 48, 0);
        }
        100% {
          transform: scale(0.9);
          opacity: 0.5;
          box-shadow: 0 0 0 0 rgba(255, 59, 48, 0);
        }
      }

      #programmatic-demo {
        flex: 1;
        width: 100%;
        min-height: 0;
        display: block;
      }

      #example {
        height: 220px;
        width: 100%;
        border-top: 1px solid #333;
        display: block;
      }

      .joiner-container {
        display: none;
        height: 160px;
        border-top: 1px solid #333;
        background: #181818;
      }

      .joiner-container.active {
        display: flex;
      }

      .joiner-pane {
        flex: 1;
        display: flex;
        flex-direction: column;
        min-width: 0;
      }

      .joiner-pane:first-child {
        border-right: 1px solid #333;
      }

      .joiner-pane-header {
        padding: 4px 8px;
        background: #252526;
        font-size: 11px;
        color: #888;
        border-bottom: 1px solid #333;
        user-select: none;
      }

      .joiner-pane textarea {
        flex: 1;
        width: 100%;
        height: 100%;
        resize: none;
        border: none;
        outline: none;
        padding: 8px;
        font-family: monospace;
        font-size: 13px;
        background: #1e1e1e;
        color: #d4d4d4;
      }

      .joiner-view {
        flex: 1;
        padding: 8px;
        font-family: monospace;
        font-size: 13px;
        background: #181818;
        color: #e5c07b;
        overflow: auto;
        white-space: pre-wrap;
        word-break: break-all;
      }
    </style>
  </head>
  <body>
    <div class="toolbar">
      <a href="tampermonkey.page.html" target="_blank" data-testid="link-tampermonkey-page">tampermonkey.page.html</a>
      <button id="copy-btn" type="button" data-testid="btn-copy-textarea">Copy to clipboard</button>
      <button id="record-btn" type="button" data-testid="btn-record-mode">
        <span class="record-dot" data-testid="indicator-record-pulse"></span>
        <span id="record-btn-text">Record</span>
      </button>
      <button id="revert-btn" type="button" data-testid="btn-revert-memory" style="display: none">Revert</button>

      <div class="toolbar-right">
        <select id="lang-select" data-testid="select-editor-lang">
          <option value="python" selected>Python</option>
          <option value="typescript">TypeScript</option>
          <option value="java">Java</option>
          <option value="javascript">JavaScript</option>
          <option value="html">HTML</option>
          <option value="css">CSS</option>
          <option value="json">JSON</option>
          <option value="markdown">Markdown</option>
          <option value="sh">Shell (sh)</option>
          <option value="sql">SQL</option>
          <option value="c_cpp">C / C++</option>
          <option value="csharp">C#</option>
          <option value="golang">Go</option>
          <option value="rust">Rust</option>
          <option value="php">PHP</option>
          <option value="ruby">Ruby</option>
          <option value="yaml">YAML</option>
          <option value="xml">XML</option>
          <option value="text">Plain Text</option>
        </select>
      </div>
    </div>

    <ace-editor id="programmatic-demo" lang="python" data-testid="editor-output">
      <script type="ace">
# Waiting for other_tabs:copy event... Any text selected on other tabs via Tampermonkey script "OS Browser Bridge - selection copy" will be captured and displayed here.
      </script>
    </ace-editor>

    <div id="joiner-panel" class="joiner-container" data-testid="container-joiner">
      <div class="joiner-pane">
        <div class="joiner-pane-header">Joiner delimiter (appended before incoming event text)</div>
        <textarea id="joiner-input" data-testid="input-joiner" placeholder="Type joiner string..."></textarea>
      </div>
      <div class="joiner-pane">
        <div class="joiner-pane-header">Joiner view (visible non-printable characters)</div>
        <div id="joiner-preview" class="joiner-view" data-testid="preview-joiner"></div>
      </div>
    </div>

    <ace-editor id="example" lang="javascript" data-testid="editor-example">
      <script type="ace">
// Run this in any other tab to send data to the editor above.
// Works across all tabs in all browsers connected to the server.

document.documentElement.dispatchEvent(
  new CustomEvent("os_browser_bridge", {
    detail: {
      event: "other_tabs:copy",
      payload: { text: "Hello from other tab: " + (new Date().toISOString()) },
    },
  })
);

// This tab listens for the arriving event:
// document.addEventListener("other_tabs:copy", (event) => {
//   // event.detail = { text: "Hello from other tab" }
// });
// there is also tampermonkey script look by name "OS Browser Bridge - selection copy"
      </script>
    </ace-editor>

    <script>
      const editor = document.getElementById("programmatic-demo");
      const copyBtn = document.getElementById("copy-btn");
      const recordBtn = document.getElementById("record-btn");
      const recordBtnText = document.getElementById("record-btn-text");
      const revertBtn = document.getElementById("revert-btn");
      const langSelect = document.getElementById("lang-select");
      const exampleEditor = document.getElementById("example");
      const joinerPanel = document.getElementById("joiner-panel");
      const joinerInput = document.getElementById("joiner-input");
      const joinerPreview = document.getElementById("joiner-preview");

      // Regular mode (isRecording = false) overrides editor on every new event
      // Record mode (isRecording = true) appends joiner delimiter followed by new incoming text
      let isRecording = false;

      // Array storing all events data in record mode
      const memory = [];

      // Default joiner delimiter is single newline character \n
      joinerInput.value = "\n";

      /**
       * Safely sets text value on ace-editor web component
       */
      function setEditorValue(value) {
        editor.setAttribute("value", value);
      }

      /**
       * Safely gets current text value from ace-editor web component
       */
      function getEditorValue() {
        if (typeof editor.value === "string") {
          return editor.value;
        }
        return editor.getAttribute("value") || "";
      }

      /**
       * Rebuilds output content solely from memory array joined with current joiner.
       */
      function rebuildOutputFromMemory() {
        const joiner = joinerInput.value;
        setEditorValue(memory.join(joiner));
      }

      function updateRevertBtnState() {
        revertBtn.disabled = memory.length === 0;
      }

      /**
       * Converts text containing invisible or non-printable characters into readable Word-like symbols.
       * Space -> middle dot (·)
       * Tab -> right arrow with stroke / arrow (→)
       * Carriage Return -> left arrow with hook (↵)
       * Newline -> pilcrow / enter symbol (¶)
       */
      function formatNonPrintable(text) {
        return text.replace(/ /g, "·").replace(/\t/g, "→").replace(/\r/g, "↵").replace(/\n/g, "¶\n");
      }

      function updateJoinerPreview() {
        joinerPreview.textContent = formatNonPrintable(joinerInput.value);
      }

      langSelect.addEventListener("change", () => {
        editor.setAttribute("lang", langSelect.value);
      });

      joinerInput.addEventListener("input", () => {
        updateJoinerPreview();
        if (isRecording) {
          rebuildOutputFromMemory();
        }
      });
      updateJoinerPreview();

      recordBtn.addEventListener("click", () => {
        isRecording = !isRecording;
        if (isRecording) {
          recordBtn.classList.add("recording");
          recordBtnText.textContent = "Recording...";
          joinerPanel.classList.add("active");
          exampleEditor.style.display = "none";
          revertBtn.style.display = "inline-flex";

          // Seed memory with existing content if present so everything is in memory
          memory.length = 0;
          const currentVal = getEditorValue();
          if (currentVal.length > 0) {
            memory.push(currentVal);
          }
          updateRevertBtnState();
        } else {
          recordBtn.classList.remove("recording");
          recordBtnText.textContent = "Record";
          joinerPanel.classList.remove("active");
          exampleEditor.style.display = "block";
          revertBtn.style.display = "none";

          memory.length = 0;
        }
      });

      revertBtn.addEventListener("click", () => {
        if (memory.length > 0) {
          memory.pop();
          rebuildOutputFromMemory();
          updateRevertBtnState();
        }
      });

      copyBtn.addEventListener("click", async () => {
        try {
          await navigator.clipboard.writeText(getEditorValue());
          const originalText = copyBtn.innerText;
          copyBtn.innerText = "Copied!";
          setTimeout(() => {
            copyBtn.innerText = originalText;
          }, 1500);
        } catch (err) {
          console.error("Failed to copy text: ", err);
        }
      });

      document.addEventListener("other_tabs:copy", (event) => {
        const { detail } = event;
        let incomingText = "";

        if (detail && typeof detail.text !== "undefined") {
          incomingText = String(detail.text);
        } else {
          incomingText = JSON.stringify(detail, null, 2);
        }

        if (isRecording) {
          memory.push(incomingText);
          rebuildOutputFromMemory();
          updateRevertBtnState();
        } else {
          setEditorValue(incomingText);
        }
      });
    </script>
  </body>
</html>
