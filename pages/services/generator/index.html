<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Name Generator - AWS Style</title>
    <link rel="stylesheet" href="/css/gcp-css.css" />
    <script
      type="module"
      src="https://stopsopa.github.io/ace-editor-webcomponent/ace-web-component.js"
      data-main-ace="https://cdnjs.cloudflare.com/ajax/libs/ace/1.43.3/ace.min.js"
    ></script>
    <style>
      /*
        Form controls, buttons and links are styled by /css/gcp-css.css (class gcp-css, see gcp-css skill).
        Here only layout. gcp-css doesn't set a font - it inherits the one from body.
      */
      body {
        margin: 0;
        padding: 0;
        font-family: Roboto, Arial, sans-serif;
        background-color: #f8f9fa;
        color: #3c4043;
        display: flex;
        flex-direction: column;
        min-height: 100vh;
      }

      .container {
        box-sizing: border-box;
        width: 100%;
        max-width: 800px;
        margin: 40px auto;
        padding: 0 20px;
        flex: 1;
      }

      /* white card: gcp-css floating label needs --gcp-css-bg equal to background behind the field (default #fff) */
      .card {
        background-color: #fff;
        border: 1px solid #dadce0;
        border-radius: 8px;
        padding: 24px;
      }

      h1 {
        font-size: 22px;
        font-weight: 500;
        margin: 0 0 24px 0;
      }

      /* one line of fields / buttons, all items of the same height so they sit on one line */
      .controls {
        --row-height: 36px;
        /* space between rows is done with margin of .controls, not with margin of the wrappers */
        --gcp-css-field-gap: 0;

        align-items: flex-start;
        display: flex;
        flex-wrap: wrap;
        gap: 12px;
        margin-bottom: 20px;

        .input-wrapper {
          flex: 0 1 140px;

          input {
            height: var(--row-height);
          }
        }

        button {
          box-sizing: border-box;
          height: var(--row-height);
        }

        .checkbox-wrapper {
          align-self: center;
        }

        /* pushes "group by" checkbox to the right */
        .spacer {
          flex: 1 1 auto;
        }
      }

      ace-editor {
        display: block;
        width: 100%;
        min-height: 320px;
        height: auto;
        border: 1px solid #dadce0;
        border-radius: 4px;
        background-color: #fafbfc;
      }

      #toast {
        position: fixed;
        bottom: 20px;
        left: 50%;
        transform: translateX(-50%);
        background: #3c4043;
        color: white;
        padding: 10px 20px;
        border-radius: 4px;
        display: none;
        font-size: 14px;
      }

      footer {
        margin-top: 40px;
        padding: 20px 0;
        border-top: 1px solid #dadce0;
        width: 100%;
        flex-shrink: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 14px;
        color: #5f6368;
        gap: 5px;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="card">
        <h1>Resource Name Generator</h1>
        <!-- gcp-css: control first, label directly after it, placeholder must not be empty -->
        <div class="controls gcp-css">
          <div class="input-wrapper">
            <input
              type="text"
              id="seedInput"
              placeholder=" "
              title="Random seed"
              onclick="this.select()"
              data-testid="input-seed"
            />
            <label for="seedInput">Seed</label>
          </div>
          <button type="button" id="randBtn" class="secondary" data-testid="button-rand">rand</button>
          <div class="input-wrapper">
            <input
              type="text"
              id="sepInput"
              placeholder=" "
              title="Separator"
              value="_"
              onclick="this.select()"
              data-testid="input-separator"
            />
            <label for="sepInput">Separator</label>
          </div>
          <div class="spacer"></div>
          <div class="checkbox-wrapper">
            <input type="checkbox" id="groupCheck" checked data-testid="checkbox-group" />
            <label for="groupCheck">Group by 10</label>
          </div>
        </div>
        <div class="controls gcp-css">
          <button type="button" id="generateBtn" data-testid="button-generate">Generate 10 names</button>
          <button type="button" id="copyBtn" class="secondary" data-testid="button-copy">Copy all</button>
          <button type="button" id="clearBtn" class="secondary" data-testid="button-clear">Clear</button>
        </div>
        <!-- editor is outside of .gcp-css on purpose, so gcp-css doesn't touch internals of ace -->
        <ace-editor lang="text" id="nameOutput">
          <script type="ace"></script>
        </ace-editor>
      </div>
    </div>
    <footer class="gcp-css">
      Inspiration:
      <a
        href="https://github.com/moby/moby/blob/8bb58153e75b4310f3ae9ec6d03924aa286fbf20/pkg/namesgenerator/names-generator.go"
        target="_blank"
        data-testid="link-inspiration"
        >Docker names generator (GitHub)</a
      >
    </footer>

    <div id="toast">Copied!</div>

    <script type="module">
      import { getParts } from "./index.js";

      const output = document.getElementById("nameOutput");
      const sepInput = document.getElementById("sepInput");
      const groupCheck = document.getElementById("groupCheck");
      const seedInput = document.getElementById("seedInput");
      const generateBtn = document.getElementById("generateBtn");
      const randBtn = document.getElementById("randBtn");
      const clearBtn = document.getElementById("clearBtn");
      const copyBtn = document.getElementById("copyBtn");
      const toast = document.getElementById("toast");

      // Mulberry32 PRNG
      function mulberry32(a) {
        return function () {
          var t = (a += 0x6d2b79f5);
          t = Math.imul(t ^ (t >>> 15), t | 1);
          t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
          return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
        };
      }

      // Simple string hash
      function hashString(str) {
        let hash = 0;
        for (let i = 0; i < str.length; i++) {
          hash = (hash << 5) - hash + str.charCodeAt(i);
          hash |= 0;
        }
        return hash >>> 0;
      }

      // Store history of generated base parts locally
      let history = [];
      let currentRNG = null;

      function resetRNG() {
        const seed = seedInput.value;
        const seedNum = isNaN(parseInt(seed)) ? hashString(seed) : parseInt(seed);
        currentRNG = mulberry32(seedNum);
        history = [];
      }

      function syncUrl() {
        const url = new URL(window.location);
        const sep = sepInput.value;
        const group = groupCheck.checked;
        const seed = seedInput.value;

        if (sep === "_") url.searchParams.delete("sep");
        else url.searchParams.set("sep", sep);

        if (group) url.searchParams.delete("group");
        else url.searchParams.set("group", "0");

        if (seed) url.searchParams.set("seed", seed);
        else url.searchParams.delete("seed");

        window.history.replaceState({}, "", url);
      }

      function updateDisplay() {
        const sep = sepInput.value;
        const isGrouped = groupCheck.checked;

        let result = [];
        history.forEach((item, index) => {
          result.push(`${item.l}${sep}${item.r}`);
          if (isGrouped && (index + 1) % 10 === 0 && index + 1 !== history.length) {
            result.push("");
          }
        });

        output.setAttribute("value", result.join("\n"));
        syncUrl();
      }

      function generateBatch() {
        const newBatch = [];
        while (newBatch.length < 10) {
          const { l, r } = getParts(currentRNG);
          const name = `${l}${sepInput.value}${r}`;

          const isDuplicate =
            history.some((h) => h.l === l && h.r === r) || newBatch.some((n) => n.l === l && n.r === r);

          if (!isDuplicate && name !== `boring${sepInput.value}wozniak`) {
            newBatch.push({ l, r });
          }
        }

        history = [...history, ...newBatch];
        updateDisplay();
      }

      generateBtn.onclick = generateBatch;

      clearBtn.onclick = () => {
        history = [];
        updateDisplay();
      };

      seedInput.oninput = () => {
        resetRNG();
        generateBatch();
      };

      randBtn.onclick = () => {
        seedInput.value = Math.floor(Math.random() * 1000000);
        resetRNG();
        generateBatch();
      };

      sepInput.addEventListener("input", updateDisplay);
      groupCheck.addEventListener("change", updateDisplay);

      copyBtn.onclick = () => {
        const val = output.getAttribute("value");
        if (!val) return;
        navigator.clipboard.writeText(val).then(() => {
          toast.style.display = "block";
          setTimeout(() => (toast.style.display = "none"), 2000);
        });
      };

      window.addEventListener("load", () => {
        const params = new URLSearchParams(window.location.search);
        if (params.has("sep")) sepInput.value = params.get("sep");
        if (params.get("group") === "0") groupCheck.checked = false;

        if (params.has("seed")) {
          seedInput.value = params.get("seed");
        } else {
          seedInput.value = Math.floor(Math.random() * 1000000);
        }

        resetRNG();
        setTimeout(generateBatch, 100);
      });
    </script>
  </body>
</html>
